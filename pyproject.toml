[project]
name = "msc-thesis"
version = "0.1.0"
requires-python = ">=3.13"
dependencies = [
    "dcor>=0.7",
    "fastexcel>=0.18.0",
    "graphviz>=0.21",
    "iplotx>=1.7.0",
    "ipywidgets>=8.1.8",
    "jax>=0.9.0",
    "jupyter>=1.1.1",
    "jupyterlab>=4.5.2",
    "matplotlib>=3.10.8",
    "networkx>=3.6.1",
    "numpyro>=0.19.0",
    "pandas>=2.3.3",
    "pandera[polars]>=0.28.1",
    "papermill>=2.7.0",
    "polars>=1.37.1",
    "pyarrow>=22.0.0",
    "pydantic-settings>=2.12.0",
    "pymc>=5.27.0",
    "pymc-extras>=0.7.0",
    "quarto>=0.1.0",
    "rich>=14.2.0",
    "scikit-learn>=1.8.0",
    "scipy>=1.17.0",
    "seaborn>=0.13.2",
    "sqlalchemy>=2.0.45",
    "statsmodels>=0.14.6",
]

[dependency-groups]
docs = [
    "mkdocs>=1.6.1",
    "mkdocs-bibtex>=4.4.0",
    "mkdocs-material>=9.7.0",
]

[build-system]
requires = ["uv_build>=0.9.26,<0.10.0"]
build-backend = "uv_build"

[project.scripts]
cadata = "climate_attitudes.cli:cli.main"

[tool.uv.build-backend]
module-name = "climate_attitudes"

[tool.ruff.lint]
select = [
    # pydocstyle
    # "D", # comment to ignore docstring checks
    # pycodestyle
    "E",
    # Pyflakes
    "F",
    # pyupgrade
    "UP",
    # flake8-bugbear
    "B",
    # flake8-simplify
    "SIM",
    # isort
    "I",
]

# [tool.ruff.lint.pydocstyle]
# convention = "google"
